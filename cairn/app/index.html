<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cairn</title>
<meta name="description" content="The record your AI secretary should have been keeping.">
<meta name="theme-color" content="#FDF6E3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#002B36" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Cairn">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%23FDF6E3'/><rect x='6' y='22' width='20' height='5' rx='2.5' fill='%231B6E67'/><rect x='9' y='15' width='14' height='5' rx='2.5' fill='%231F7A73'/><rect x='12' y='8' width='8' height='5' rx='2.5' fill='%232AA198'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;450;600&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
  <div class="wrap topbar-in">
    <span class="brand">
      <svg width="20" height="20" viewBox="0 0 32 32" aria-hidden="true">
        <rect x="5" y="22" width="22" height="5" rx="2.5" fill="var(--cyan)"></rect>
        <rect x="8.5" y="15" width="15" height="5" rx="2.5" fill="var(--cyan-fill)"></rect>
        <rect x="12" y="8" width="8" height="5" rx="2.5" fill="var(--cyan-fill)" opacity=".75"></rect>
      </svg>
      Cairn
    </span>
    <button class="icon-btn" id="open-settings" aria-label="Settings and data">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round">
        <circle cx="12" cy="12" r="3"></circle>
        <path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M19.1 4.9L17 7M7 17l-2.1 2.1"></path>
      </svg>
    </button>
  </div>
</header>

<main class="wrap" id="view" role="main"></main>

<nav class="tabs" role="tablist" aria-label="Sections">
  <div class="tabs-in">
    <button class="tab" role="tab" data-tab="today" aria-selected="true">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
        <circle cx="12" cy="13" r="5"></circle><path d="M12 2v2M4.2 5.2l1.4 1.4M19.8 5.2l-1.4 1.4"></path>
      </svg>
      Today
    </button>
    <button class="tab" role="tab" data-tab="review" aria-selected="false">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
        <circle cx="11" cy="11" r="7"></circle><path d="M16 16l5 5"></path>
      </svg>
      Review
    </button>
    <button class="tab" role="tab" data-tab="manage" aria-selected="false">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
        <path d="M4 6h16M4 12h16M4 18h16"></path>
      </svg>
      Everything
    </button>
  </div>
</nav>

<div id="sheet-host"></div>
<div id="toast-host"></div>

<script type="module" src="app.js"></script>
<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("sw.js").catch(() => {});
    });
  }
</script>
</body>
</html>
