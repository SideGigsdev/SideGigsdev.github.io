<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cairn — six questions</title>
<meta name="description" content="Six questions about how you run your life, and what breaks when it stops working.">
<meta name="theme-color" content="#FDF6E3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#002B36" media="(prefers-color-scheme: dark)">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%23FDF6E3'/><rect x='6' y='22' width='20' height='5' rx='2.5' fill='%231B6E67'/><rect x='9' y='15' width='14' height='5' rx='2.5' fill='%231F7A73'/><rect x='12' y='8' width='8' height='5' rx='2.5' fill='%232AA198'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Literata:opsz,wght@7..72,400;7..72,500;7..72,600;7..72,700&display=swap">
<style>
  :root{
    --ground:#FDF6E3;--surface:#FFFBF0;--sunk:#F2ECD8;--rule:#E3DCC6;--rule-hi:#D3C9A8;
    --ink:#062E38;--body:#48626E;--muted:#5F7480;--accent:#1B6E67;--accent-fill:#2AA198;
    --orange:#B7431A;
  }
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
    --ground:#002B36;--surface:#073642;--sunk:#05303C;--rule:#0D4655;--rule-hi:#14586A;
    --ink:#EEE8D5;--body:#A3B1B1;--muted:#8A9A9C;--accent:#49C2B8;--accent-fill:#2AA198;
    --orange:#E8743C;}}
  :root[data-theme="dark"]{
    --ground:#002B36;--surface:#073642;--sunk:#05303C;--rule:#0D4655;--rule-hi:#14586A;
    --ink:#EEE8D5;--body:#A3B1B1;--muted:#8A9A9C;--accent:#49C2B8;--accent-fill:#2AA198;
    --orange:#E8743C;}

  *,*::before,*::after{box-sizing:border-box}
  body{margin:0;background:var(--ground);color:var(--body);
       font-family:Literata,Georgia,"Times New Roman",serif;font-size:1.09rem;line-height:1.6;
       font-optical-sizing:auto;
       min-height:100vh;display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}
  .mono,h1,h2{font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace}
  h1,h2{letter-spacing:-.018em}
  h1,h2{color:var(--ink);margin:0;letter-spacing:-.03em;text-wrap:balance}
  p{margin:0}
  button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
  :focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:6px}

  .bar{height:3px;background:var(--sunk);position:sticky;top:0;z-index:5}
  .bar i{display:block;height:100%;background:var(--accent-fill);width:0;transition:width .3s ease}
  @media (prefers-reduced-motion:reduce){.bar i{transition:none}}

  main{flex:1;display:flex;align-items:center;justify-content:center;padding:2rem 1.15rem 3rem}
  .card{width:100%;max-width:34rem}

  .step{font-family:"IBM Plex Mono",monospace;font-size:.72rem;letter-spacing:.14em;
        text-transform:uppercase;color:var(--accent);margin-bottom:.9rem}
  h2{font-size:clamp(1.35rem,4.2vw,1.85rem);line-height:1.18}
  .hint{margin-top:.55rem;font-size:.92rem;color:var(--muted)}

  .options{margin-top:1.4rem;display:grid;gap:.5rem}
  .opt{display:flex;align-items:center;gap:.7rem;width:100%;text-align:left;
       padding:.8rem .9rem;border-radius:12px;background:var(--surface);
       border:1px solid var(--rule-hi);color:var(--ink);min-height:52px}
  .opt:hover{border-color:var(--accent-fill)}
  .opt[aria-pressed="true"]{background:var(--accent);color:#FFFBF0;border-color:var(--accent)}
  .opt kbd{font-family:"IBM Plex Mono",monospace;font-size:.72rem;min-width:1.35rem;height:1.35rem;
           display:grid;place-items:center;border-radius:4px;background:var(--sunk);color:var(--muted)}
  .opt[aria-pressed="true"] kbd{background:rgba(255,255,255,.22);color:#FFFBF0}

  textarea,input[type=email]{width:100%;margin-top:1.3rem;padding:.85rem .9rem;border-radius:12px;
    border:1px solid var(--rule-hi);background:var(--surface);color:var(--ink);
    font:inherit;font-family:Literata,Georgia,serif;resize:vertical}
  textarea{min-height:6.5rem}
  input[type=text]{width:100%;margin-top:1.3rem;padding:.85rem .9rem;border-radius:12px;
    border:1px solid var(--rule-hi);background:var(--surface);color:var(--ink);
    font:inherit;font-family:Literata,Georgia,serif}

  .actions{display:flex;align-items:center;gap:.8rem;margin-top:1.5rem;flex-wrap:wrap}
  .next{font-family:"IBM Plex Mono",monospace;font-weight:600;padding:.72rem 1.35rem;
        border-radius:11px;background:var(--accent);color:#FFFBF0}
  .next:disabled{opacity:.45;cursor:default}
  .back{color:var(--muted);font-size:.9rem}
  .kbdhint{font-size:.78rem;color:var(--muted)}

  .done h2{margin-bottom:.7rem}
  .done p{margin-bottom:.8rem}
  a{color:var(--accent)}
  footer{padding:1.2rem;text-align:center;font-size:.82rem;color:var(--muted)}
</style>
</head>
<body>

<div class="bar"><i id="bar"></i></div>

<main>
  <div class="card" id="card"></div>
</main>

<footer>Cairn · <a href="../">what this is</a></footer>

<script>
// Point this at a form endpoint (Formspree, Basin, Netlify) and answers post
// straight there. Left empty, the last step offers a copyable summary and an
// email fallback, so the survey is never a dead end.
const FORM_ENDPOINT = "https://formspree.io/f/mbgjzrdd";
const FALLBACK_EMAIL = "goyalnaman.work@gmail.com";

const QUESTIONS = [
  {
    id: "system",
    title: "How do you actually run your life right now?",
    hint: "Whatever you really use. Not the thing you set up in January and abandoned.",
    type: "choice",
    options: [
      "Notion, Obsidian or similar",
      "A to-do app — Things, Todoist, Reminders",
      "Notes app or a folder of markdown",
      "Paper — notebook, bullet journal",
      "A chat window with an AI",
      "Nothing consistent, honestly",
    ],
  },
  {
    id: "ai_usage",
    title: "Do you use ChatGPT or Claude to plan your week or keep track of stuff?",
    hint: "This is the one I most want an honest answer to. I do it constantly.",
    type: "choice",
    options: [
      "Yes, all the time — it's part of how I work",
      "Sometimes, when things pile up",
      "Tried it, stopped",
      "No, never occurred to me",
    ],
  },
  {
    id: "decay",
    title: "When your setup stops working, what goes first?",
    hint: "Mine never collapses all at once. It just quietly rots in one specific place.",
    type: "choice",
    options: [
      "I stop opening it at all",
      "I keep capturing but stop reviewing",
      "It fills with stale things I'll never do",
      "It works fine, I just stop doing what it says",
      "It doesn't. Mine holds up",
    ],
  },
  {
    id: "story",
    title: "What's the last system you built for yourself that stopped working?",
    hint: "Optional, but honestly this is the most useful box on the page. One line is plenty.",
    type: "text",
    placeholder: "built a whole Notion dashboard in January, stopped opening it by February…",
    optional: true,
  },
  {
    // Deliberately not "would you pay $X" — naming a number anchors people and
    // you get your own guess back. Asking for the fair price and the walk-away
    // price separately gives a usable range per person (Van Westendorp).
    id: "fair_price",
    title: "What would feel like a fair price for this, per month?",
    hint: "Any currency, whatever you think in. \u201cNothing\u201d is a real answer and I\u2019d rather have it than a polite number.",
    type: "short",
    placeholder: "e.g. \u20b9200, $5, nothing",
  },
  {
    id: "too_expensive",
    title: "And at what price would you just not bother?",
    hint: "The point where it stops being worth it, even if you liked it. Optional.",
    type: "short",
    placeholder: "e.g. \u20b9600, $15",
    optional: true,
  },
  {
    id: "email",
    title: "Want to know when there's something worth trying?",
    hint: "Optional. One email, when there's a real thing. No launch sequence, I promise.",
    type: "email",
    placeholder: "you@email.com",
    optional: true,
  },
];

const answers = {};
let index = 0;
const card = document.getElementById("card");
const bar = document.getElementById("bar");

const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

function draw() {
  bar.style.width = `${(index / QUESTIONS.length) * 100}%`;
  const q = QUESTIONS[index];

  let field = "";
  if (q.type === "choice") {
    field = `<div class="options" role="group">${q.options.map((opt, i) => `
      <button class="opt" data-value="${esc(opt)}" aria-pressed="${answers[q.id] === opt}">
        <kbd>${String.fromCharCode(65 + i)}</kbd><span>${esc(opt)}</span>
      </button>`).join("")}</div>`;
  } else if (q.type === "text") {
    field = `<textarea id="input" placeholder="${esc(q.placeholder || "")}">${esc(answers[q.id] || "")}</textarea>`;
  } else if (q.type === "short") {
    field = `<input type="text" id="input" inputmode="text" autocomplete="off"
              placeholder="${esc(q.placeholder || "")}" value="${esc(answers[q.id] || "")}">`;
  } else {
    field = `<input type="email" id="input" placeholder="${esc(q.placeholder || "")}" value="${esc(answers[q.id] || "")}">`;
  }

  card.innerHTML = `
    <p class="step">Question ${index + 1} of ${QUESTIONS.length}</p>
    <h2>${esc(q.title)}</h2>
    ${q.hint ? `<p class="hint">${esc(q.hint)}</p>` : ""}
    ${field}
    <div class="actions">
      <button class="next" id="next">${index === QUESTIONS.length - 1 ? "Send" : "Next"}</button>
      ${index > 0 ? `<button class="back" id="back">Back</button>` : ""}
      <span class="kbdhint">${q.type === "choice" ? "Press A–" + String.fromCharCode(64 + q.options.length) : "⌘/Ctrl + Enter"} to continue</span>
    </div>`;

  card.querySelectorAll(".opt").forEach((button) => {
    button.addEventListener("click", () => {
      answers[q.id] = button.dataset.value;
      card.querySelectorAll(".opt").forEach((o) => o.setAttribute("aria-pressed", "false"));
      button.setAttribute("aria-pressed", "true");
      setTimeout(advance, 160);
    });
  });

  const input = document.getElementById("input");
  if (input) {
    input.focus();
    input.addEventListener("input", () => { answers[q.id] = input.value; });
    input.addEventListener("keydown", (event) => {
      if (event.key === "Enter" && (event.metaKey || event.ctrlKey)) advance();
      if (event.key === "Enter" && (q.type === "email" || q.type === "short")) { event.preventDefault(); advance(); }
    });
  }

  document.getElementById("next").addEventListener("click", advance);
  document.getElementById("back")?.addEventListener("click", () => { index -= 1; draw(); });
}

function advance() {
  const q = QUESTIONS[index];
  if (!q.optional && !answers[q.id]) {
    document.getElementById("next").animate(
      [{ transform: "translateX(0)" }, { transform: "translateX(-5px)" },
       { transform: "translateX(5px)" }, { transform: "translateX(0)" }],
      { duration: 220 });
    return;
  }
  if (index < QUESTIONS.length - 1) { index += 1; draw(); return; }
  submit();
}

async function submit() {
  bar.style.width = "100%";
  const summary = QUESTIONS.map((q) => `${q.title}\n→ ${answers[q.id] || "(skipped)"}`).join("\n\n");

  const finish = (message, extra = "") => {
    card.innerHTML = `<div class="done">
      <p class="step">Done</p>
      <h2>Thank you, really.</h2>
      <p>${message}</p>
      ${extra}
      <div class="actions">
        <a class="next" href="../app/" style="text-decoration:none">Try the app →</a>
        <a class="back" href="../">Back to the page</a>
      </div></div>`;
  };

  if (!FORM_ENDPOINT) {
    const mailto = `mailto:${FALLBACK_EMAIL}?subject=${encodeURIComponent("Cairn survey")}&body=${encodeURIComponent(summary)}`;
    finish("The form isn't hooked up yet, so this last bit is manual. Sorry.",
      `<p><a href="${mailto}">Send these answers by email</a>, or paste them anywhere you like:</p>
       <textarea readonly style="margin-top:.6rem">${esc(summary)}</textarea>`);
    return;
  }

  try {
    const body = new FormData();
    Object.entries(answers).forEach(([key, value]) => body.append(key, value));
    body.append("_subject", "Cairn survey response");
    const response = await fetch(FORM_ENDPOINT, { method: "POST", headers: { Accept: "application/json" }, body });
    if (!response.ok) throw new Error(String(response.status));
    finish("That's exactly what I needed. If you left an email I'll write once, when there's something real to try.");
  } catch {
    const mailto = `mailto:${FALLBACK_EMAIL}?subject=${encodeURIComponent("Cairn survey")}&body=${encodeURIComponent(summary)}`;
    finish("That didn't send, and that's my fault not yours.",
      `<p><a href="${mailto}">Send it by email instead</a> and I'll add it by hand.</p>`);
  }
}

document.addEventListener("keydown", (event) => {
  const q = QUESTIONS[index];
  if (!q || q.type !== "choice") return;
  if (event.metaKey || event.ctrlKey || event.altKey) return;
  const position = event.key.toUpperCase().charCodeAt(0) - 65;
  if (position >= 0 && position < q.options.length) {
    const button = card.querySelectorAll(".opt")[position];
    button?.click();
  }
});

draw();
</script>
</body>
</html>
